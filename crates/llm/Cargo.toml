[package]
name = "juanola-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false, features = ["common"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false, features = ["common", "metal"] }

[features]
default = ["openai-compatible"]
openai-compatible = []
# Al activar un backend, sustituye `[]` por `["dep:<crate>"]` y añade la dependencia opcional.
llamacpp = ["dep:llama-cpp-2"]    # llama-cpp-2: GGUF local, GBNF/JSON schema, Metal/CUDA/Vulkan
mistralrs = []   # mistralrs: alternativa puro Rust

[dev-dependencies]
