# Release de la app de macOS: al subir un tag `v*` (o a mano), compila el worker
# de STT con MLX y la app, y crea un borrador de GitHub Release con el .dmg y
# el .app comprimido. El borrador se revisa y se publica a mano.
#
# El build (que ejecuta scripts y dependencias de terceros) solo puede leer el
# repo; el token con permiso de escritura lo usa únicamente el job `publish`,
# que no ejecuta nada del repo: sube los artefactos ya compilados.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# La versión sale de `apps/desktop/src-tauri/tauri.conf.json`; el tag tiene que
# coincidir con ella. A mano (workflow_dispatch) solo desde `main`, y crea el
# tag `v<versión>`, que no puede existir ya.
#
# Firma: sin certificado, la app sale con firma ad-hoc (`signingIdentity: "-"`
# en tauri.conf.json) y sin notarizar. Sin esa firma del bundle, macOS dice que
# la app descargada «está dañada»; con ella, avisa de que no puede verificarla y
# deja abrirla desde Ajustes › Privacidad y seguridad › Abrir igualmente (o con
# `xattr -dr com.apple.quarantine`). Para firmar con Developer ID, añade los secretos APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD y APPLE_TEAM_ID y pásalos en
# el `env` del paso de tauri-action.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Un tag vX que no coincide con la versión de tauri.conf.json crearía
      # una release llamada vX con binarios vY.
      - name: Comprobar tag ↔ versión
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "$REF_TYPE" = tag ]; then
            [ "${REF_NAME#v}" = "$v" ] || { echo "::error::el tag ${REF_NAME} no coincide con version=$v de tauri.conf.json"; exit 1; }
          else
            [ "$REF_NAME" = main ] || { echo "::error::las releases a mano solo salen de main (no de ${REF_NAME})"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: release

      # Código de llama.cpp y kernels de MLX precompilados: no están en git y
      # los scripts comprueban su SHA-256 fijado. Se bajan siempre (sin caché de
      # actions) para verificarlos en esta misma ejecución.
      - name: Bajar llama.cpp y el metallib de MLX
        run: |
          scripts/fetch-llama-cpp.sh
          scripts/fetch-mlx-metallib.sh

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Dependencias del frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # `beforeBuildCommand` (tauri.conf.json) compila el sidecar con MLX y el
      # frontend; tauri-action solo compila y empaqueta (sin token no sube nada).
      - name: Compilar
        id: build
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri

      - name: Reunir artefactos
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-release
          cp target/release/bundle/dmg/*.dmg dist-release/
          tar -czf "dist-release/Juanola_${VERSION}_aarch64.app.tar.gz" -C target/release/bundle/macos Juanola.app
          ls -l dist-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Borrador de release
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos
          path: dist-release
      - name: Crear el borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.macos.outputs.version }}
          VERSION: ${{ needs.macos.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          # Nunca reutilizar una release (borradores incluidos) ni, a mano, un tag existente: colgaría
          # binarios nuevos de otro commit. En push de tag, el tag tiene que existir.
          if gh release list --limit 200 --json tagName -q '.[].tagName' | grep -Fxq "$TAG"; then
            echo "::error::ya hay una release $TAG: bórrala o sube la versión"; exit 1
          fi
          if [ "$EVENT" = push ]; then
            verify=--verify-tag
          elif gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::el tag $TAG ya existe: sube la versión en tauri.conf.json"; exit 1
          else
            verify=
          fi
          cat > notes.md <<'NOTES'
          Preview build for Apple Silicon Macs (macOS 26 or later). It is not notarized yet,
          so the first time macOS says it can't verify the developer. Drag Juanola to
          Applications, open it once, then go to System Settings › Privacy & Security and
          click Open Anyway (or run `xattr -dr com.apple.quarantine /Applications/Juanola.app`).
          The models (about 3.5 GB) are downloaded from the app on first launch.
          NOTES
          gh release create "$TAG" dist-release/* ${verify:+"$verify"} --draft --target "$GITHUB_SHA" --title "Juanola v$VERSION" --notes-file notes.md
