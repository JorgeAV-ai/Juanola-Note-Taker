[package]
name = "juanola-calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
juanola-core-types.workspace = true
async-trait.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
# oauth2 = "5"       # PKCE + loopback para Google y Microsoft

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSString", "NSURL", "NSError", "NSArray", "NSEnumerator", "NSPredicate", "NSObject"] }
objc2-event-kit = { version = "0.3", default-features = false, features = [
  "std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKParticipant", "EKSource", "EKTypes",
] }
