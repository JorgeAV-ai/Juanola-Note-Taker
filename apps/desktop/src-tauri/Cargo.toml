[package]
name = "granola-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "granola_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
anyhow.workspace = true

granola-core-types.workspace = true
granola-db.workspace = true
granola-audio-capture.workspace = true
granola-stt.workspace = true
granola-llm.workspace = true
granola-enhance.workspace = true
granola-calendar.workspace = true
granola-detect.workspace = true
granola-models.workspace = true
granola-dictation.workspace = true
chrono.workspace = true
uuid.workspace = true
