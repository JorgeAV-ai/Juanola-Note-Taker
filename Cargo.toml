[workspace]
resolver = "2"
members = [
  "crates/core-types",
  "crates/db",
  "crates/search",
  "crates/audio-capture",
  "crates/audio-store",
  "crates/stt",
  "crates/diarize",
  "crates/llm",
  "crates/embed",
  "crates/prompts",
  "crates/enhance",
  "crates/calendar",
  "crates/detect",
  "crates/speaker-tags",
  "crates/dictation",
  "crates/models",
  "crates/mcp-server",
  "crates/api-server",
  "crates/integrations",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/JorgeAV-ai/Juanola-Note-Taker"

[workspace.dependencies]
# núcleo
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
dirs = "6"
toml = "0.8"

# datos
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }

# web / integraciones
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"

# crates internos
juanola-core-types = { path = "crates/core-types" }
juanola-db = { path = "crates/db" }
juanola-search = { path = "crates/search" }
juanola-audio-capture = { path = "crates/audio-capture" }
juanola-audio-store = { path = "crates/audio-store" }
juanola-stt = { path = "crates/stt" }
juanola-diarize = { path = "crates/diarize" }
juanola-llm = { path = "crates/llm" }
juanola-embed = { path = "crates/embed" }
juanola-prompts = { path = "crates/prompts" }
juanola-enhance = { path = "crates/enhance" }
juanola-calendar = { path = "crates/calendar" }
juanola-detect = { path = "crates/detect" }
juanola-speaker-tags = { path = "crates/speaker-tags" }
juanola-dictation = { path = "crates/dictation" }
juanola-models = { path = "crates/models" }
juanola-mcp-server = { path = "crates/mcp-server" }
juanola-api-server = { path = "crates/api-server" }
juanola-integrations = { path = "crates/integrations" }

# llama.cpp y MLX se compilan con CMake en Release también en desarrollo: en
# Debug la inferencia es decenas de veces más lenta.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
debug = false

[profile.dev.package.mlxrs-sys]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# mlxrs-sys parcheado para usar un mlx.metallib precompilado (ver third_party/README.md).
[patch.crates-io]
mlxrs-sys = { path = "third_party/mlxrs-sys" }
# llama-cpp-sys-2 con llama.cpp b11960 (soporte LFM3); ver third_party/README.md.
llama-cpp-sys-2 = { path = "third_party/llama-cpp-sys-2" }
llama-cpp-2 = { path = "third_party/llama-cpp-2" }
