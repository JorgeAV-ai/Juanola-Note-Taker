# ---------------------------------------------------------------- LLM principal: LFM3-1.7B
[slots.llm_main]
description = "Enhance notes, chat, recipes. LFM3-1.7B (Liquid AI): 256K contexto, 16 idiomas, ~1 GB a 4-bit."
default = "lfm3-1.7b"

