[package]
name = "juanola-audio-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
juanola-core-types.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
# Micrófono en todas las plataformas. El audio del sistema también va por cpal:
# en macOS 14.6+ `build_input_stream` sobre un dispositivo de salida crea un
# Core Audio process tap + aggregate device (sin permiso de grabación de pantalla);
# en Windows usa WASAPI loopback.
cpal = "0.18"
# Resample a 16 kHz mono.
rubato = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Consultar y pedir el permiso de micrófono (AVCaptureDevice) antes de grabar.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
hound = "3"
anyhow.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["signal"] }

# Pendiente: `screencapturekit` como fallback para macOS 13 – 14.5.
