# Catálogo de modelos por slot. Ver docs/modelos-mvp.md para la justificación.
#
# runtime: cómo se ejecuta en Rust.  format: tipo de pesos.
#   mlx         -> mlxrs (solo macOS Apple Silicon)       format = "mlx"
#   sherpa-onnx -> sherpa-onnx (CPU, todas)               format = "onnx"
#   llama.cpp   -> llama-cpp-2 (Metal / Vulkan / CUDA)    format = "gguf"
#   ort         -> ONNX Runtime directo (embeddings)      format = "onnx"
#   speakrs     -> speakrs (CoreML en Mac, ONNX en resto) format = "onnx" | "coreml"
#   fluidaudio  -> sidecar Swift (CoreML/ANE, fase 2)     format = "coreml"
# platforms: macos-arm64 | macos-x64 | windows-x64 | linux-x64
# backends:  metal | coreml | ane | cuda | vulkan | cpu
# ready:     false = el runtime Rust aún no lo ejecuta; el selector lo salta.
# sha256 vacío = se obtiene del API de Hugging Face (LFS oid) al descargar y se fija aquí.

# ---------------------------------------------------------------- VAD
[slots.vad]
description = "Detección de actividad de voz por canal; alimenta el auto-stop (15 min sin audio)."
default = "silero-vad"

[[slots.vad.models]]
name = "silero-vad"
runtime = "mlx"
format = "mlx"
repo = "mlx-community/silero-vad"
files = ["model.safetensors", "config.json"]
dir = "vad/silero-vad-mlx"
size_mb = 2
platforms = ["macos-arm64"]
backends = ["metal"]
notes = "Usado por juanola-stt-worker (mlxrs, feature vad), en streaming por ventanas de 512 muestras."

[[slots.vad.models]]
name = "silero-vad"
runtime = "sherpa-onnx"
format = "onnx"
repo = "istupakov/silero-vad-onnx"
files = ["silero_vad.onnx"]
size_mb = 2
platforms = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]
backends = ["cpu"]

# ---------------------------------------------------------------- STT streaming
[slots.stt_streaming]
description = "Transcripción en vivo, dos canales en paralelo. Qwen3-ASR 0.6B: 30 idiomas con streaming."
default = "qwen3-asr-0.6b"

[[slots.stt_streaming.models]]
name = "qwen3-asr-0.6b"
runtime = "mlx"
format = "mlx"
repo = "mlx-community/Qwen3-ASR-0.6B-4bit"
dir = "stt_streaming/qwen3-asr-0.6b-mlx"
# El repo no trae tokenizer.json: el instalador lo genera desde vocab.json + merges.txt
# + tokenizer_config.json (juanola_models::tokenizer).
files = ["model.safetensors", "config.json", "vocab.json", "merges.txt", "tokenizer_config.json", "preprocessor_config.json"]
size_mb = 710
notes = "Transcriptor propio sobre mlxrs (crates/stt/src/backends/qwen3_mlx.rs), validado token a token contra mlx-audio."
platforms = ["macos-arm64"]
backends = ["metal"]
wer_en = 6.99
languages = 30

[[slots.stt_streaming.models]]
name = "qwen3-asr-0.6b"
runtime = "sherpa-onnx"
format = "onnx"
# Paquete prebuilt de k2-fsa (tar.bz2, no es un repo HF).
repo = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25.tar.bz2"
files = ["encoder.int8.onnx", "decoder.int8.onnx", "conv_frontend.onnx", "tokens.txt"]
size_mb = 940
notes = "sherpa-onnx 2.0.1 solo lo expone offline (OfflineQwen3ASRModelConfig): streaming simulado con VAD, como en Mac."
platforms = ["windows-x64", "linux-x64", "macos-x64", "macos-arm64"]
backends = ["cpu"]
wer_en = 6.99
languages = 30

# Alternativa "todo Liquid". Streaming (LiveASR) solo en inglés; batch en 18 locales.
