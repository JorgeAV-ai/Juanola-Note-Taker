# Release de la app de macOS: al subir un tag `v*` (o a mano), compila el worker
# de STT con MLX y la app, y crea un borrador de GitHub Release con el .dmg y
# el .app comprimido. El borrador se revisa y se publica a mano.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# La versión sale de `apps/desktop/src-tauri/tauri.conf.json`; el tag debería
# coincidir con ella.
#
# Firma: sin certificado, la app sale sin firmar ni notarizar y macOS pide
# abrirla con clic derecho › Abrir (o `xattr -dr com.apple.quarantine`). Para
# firmar, añade los secretos APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD y APPLE_TEAM_ID y pásalos en
# el `env` del paso de tauri-action.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # Código de llama.cpp y kernels de MLX precompilados: no están en git y
      # los scripts comprueban su SHA-256.
      - name: Caché de llama.cpp y MLX
        id: vendor
        uses: actions/cache@v4
        with:
          path: |
            third_party/llama-cpp-sys-2/llama.cpp
            third_party/mlx-metallib
          key: vendor-${{ hashFiles('scripts/fetch-llama-cpp.sh', 'scripts/fetch-mlx-metallib.sh') }}
      - name: Bajar llama.cpp y el metallib de MLX
        if: steps.vendor.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-llama-cpp.sh
          scripts/fetch-mlx-metallib.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Dependencias del frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # `beforeBuildCommand` (tauri.conf.json) compila el sidecar con MLX y el
      # frontend; tauri-action empaqueta y sube los artefactos al borrador.
      - name: Compilar y crear el borrador de release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Juanola v__VERSION__
          releaseBody: |
            Build de macOS para Apple Silicon (macOS 13 o posterior), sin firmar.
            Para abrirla la primera vez: clic derecho sobre Juanola.app › Abrir.
            Los modelos (unos 3,5 GB) se descargan desde la app al primer arranque.
          releaseDraft: true
          prerelease: true
