[package]
name = "juanola-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "juanola_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
anyhow.workspace = true

juanola-core-types.workspace = true
juanola-db.workspace = true
juanola-audio-capture.workspace = true
juanola-stt.workspace = true
juanola-llm = { workspace = true, features = ["llamacpp"] }
juanola-enhance.workspace = true
juanola-calendar.workspace = true
juanola-detect.workspace = true
juanola-models.workspace = true
juanola-dictation.workspace = true
chrono.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Que el aviso de reunión se vea encima de las apps a pantalla completa.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel", "NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
objc2 = "0.6"
